# Runs the browser test suite in the same pinned Linux container CI uses.
# Same browsers, same fonts, same screenshots on every machine.
#   docker compose -f docker-compose.qa.yml run --rm qa                       # full e2e suite
#   docker compose -f docker-compose.qa.yml run --rm qa npm run test:visual:update
services:
  qa:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    working_dir: /work
    ipc: host
    environment:
      CI: "1"
      # Browser tests make real rooms: use the CI Supabase project, never production.
      VITE_SUPABASE_URL: https://yarkzlhuklweotdaywcr.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7VU8E8yHnbiwe1ds9YTFqQ_ONgKd9Ns
    volumes:
      - .:/work
      - qa_node_modules:/work/node_modules   # Linux node_modules, separate from the host's
    command: bash -lc "npm ci && npx playwright test"
volumes:
  qa_node_modules:
