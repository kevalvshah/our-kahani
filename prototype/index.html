<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Kahani (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EDFB; --surface:#FFFFFF; --surface2:#F7F1FF; --ink:#241A52; --muted:#655C8F; --line:#E0D5F4;
  --pink:#CE2A6C; --pink-soft:#FCE4EE; --gold:#B87800; --gold-soft:#FFF0CC; --teal:#0B8582; --teal-soft:#D6F3F0;
  --on-pink:#FFFFFF; --dot:#241A52;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1340; --surface:#261C5C; --surface2:#30257A; --ink:#F6F0FF; --muted:#B9ADE3; --line:#43378C;
    --pink:#FF5C9A; --pink-soft:#4C2156; --gold:#FFC65C; --gold-soft:#4A3A1A; --teal:#3FD1CC; --teal-soft:#123F4C;
    --on-pink:#1A1340; --dot:#F6F0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1340; --surface:#261C5C; --surface2:#30257A; --ink:#F6F0FF; --muted:#B9ADE3; --line:#43378C;
  --pink:#FF5C9A; --pink-soft:#4C2156; --gold:#FFC65C; --gold-soft:#4A3A1A; --teal:#3FD1CC; --teal-soft:#123F4C;
  --on-pink:#1A1340; --dot:#F6F0FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;
  background-image:radial-gradient(circle,var(--dot) 1.6px,transparent 2.2px);background-size:15px 15px}
.app{position:relative;max-width:440px;margin:0 auto;padding:0 16px 48px}
button{font:inherit;color:inherit}
button:focus-visible,.field:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* demo bar */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 -16px 18px;padding:10px 16px;background:var(--surface2);border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.demobar .lbl{font-size:12.5px;color:var(--muted);flex:1 1 100%}
.seg{display:flex;flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"].kj{background:var(--pink);color:var(--on-pink)}
.seg button[aria-pressed="true"].kv{background:var(--teal);color:var(--bg)}
.seg button[aria-pressed="true"].kd{background:var(--ink);color:var(--bg)}
.reset{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}

/* home */
.hero{padding:6px 0 4px}
.season{display:inline-block;font-weight:700;font-size:13px;background:var(--gold-soft);color:var(--ink);padding:4px 12px;border-radius:99px;border:1.5px solid var(--gold)}
h1{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:56px;line-height:.95;margin:12px 0 8px;letter-spacing:-.5px}
h1 .us{color:var(--pink)}
.sub{color:var(--muted);margin:0 0 20px;max-width:36ch}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:8px 0 6px}
.dot{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.dot.off{border-style:dashed;color:var(--muted);background:transparent;cursor:default;opacity:.7}
.dot.done{background:var(--teal);border-color:var(--teal);color:var(--bg)}
.dot.today{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.legend{font-size:13px;color:var(--muted);margin:8px 0 22px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;background:var(--pink);color:var(--on-pink);font-weight:700;font-size:17px;cursor:pointer;text-align:center}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.teal{background:var(--teal);color:var(--bg)}
.note{margin-top:22px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1.5px dashed var(--line);font-size:14px;color:var(--muted)}
.sech{font-family:'Baloo 2',system-ui,sans-serif;font-size:22px;font-weight:800;margin:28px 0 4px}
.sech-sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.brow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;margin-top:8px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer}
.brow .bt{font-weight:700;line-height:1.25}
.brow .bs{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.pill{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--surface2);border:1.5px solid var(--line)}
.pill.you{background:var(--gold-soft);border-color:var(--gold)}

/* card screen */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.back{border:0;background:transparent;font-weight:700;cursor:pointer;padding:6px 0;color:var(--muted);font-size:15px}
.daytag{font-size:13px;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:26px;padding:20px 18px 22px}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 11px;border-radius:99px;background:var(--pink-soft);color:var(--ink)}
.tag.from{background:var(--teal-soft)}
.q{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:28px;line-height:1.12;margin:12px 0 18px}
.q small{display:block;font-size:15px;font-weight:600;color:var(--muted);margin-bottom:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>.opt:last-child:nth-child(odd){grid-column:1/-1}
.stack{display:grid;gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 10px;border-radius:20px;background:var(--surface2);border:2px solid var(--line);cursor:pointer;text-align:center}
.opt .em{font-size:38px;line-height:1.1}
.opt .lb{font-family:'Baloo 2',system-ui,sans-serif;font-weight:600;font-size:18px;line-height:1.15}
.opt .sb{font-size:13px;color:var(--muted)}
.opt.row-h{flex-direction:row;justify-content:flex-start;gap:14px;padding:16px 16px;text-align:left}
.opt.row-h .em{font-size:32px}
.opt:active{transform:scale(.985)}
.opt[disabled]{cursor:default}
.opt.sel-k{border-color:var(--pink);background:var(--pink-soft)}
.opt.sel-v{border-color:var(--teal);background:var(--teal-soft)}
.opt.dashed{border-style:dashed;background:transparent;margin-top:12px;width:100%}
.opt.dashed .lb{font-size:16px;color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin:14px 0 0}
.wait{margin-top:14px;padding:11px 14px;border-radius:14px;background:var(--teal-soft);font-size:14px;font-weight:500}
.field{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);margin-bottom:12px}
.field:focus{outline:none;border-color:var(--pink)}
.customrow{margin-top:12px;padding:14px;border-radius:18px;background:var(--gold-soft);border:2px solid var(--gold)}
.customrow p{margin:0 0 10px;font-weight:700;font-size:14.5px}
.customrow .field{margin-bottom:10px}

/* reveal */
.reveal{margin-top:20px;display:grid;gap:10px}
.banner{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1.15;margin:0 0 4px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--surface2);border-left:6px solid var(--line)}
.row.k{border-left-color:var(--pink)}
.row.v{border-left-color:var(--teal)}
.nm{font-weight:700;min-width:52px;font-size:14px;color:var(--muted);padding-top:1px}
.val{font-weight:700;flex:1}
.why{font-weight:400;font-style:italic;color:var(--muted);margin-top:3px}
.added{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--gold-soft);border:1.5px solid var(--gold);vertical-align:middle}
.veilwrap{position:relative;border-radius:16px;overflow:hidden}
.veilwrap .vc{transition:filter .9s ease}
.veilwrap.veil-on .vc{filter:blur(9px)}
.veil{position:absolute;inset:0;border-radius:16px;pointer-events:none;opacity:0;transition:opacity .9s ease;
  background-color:var(--surface2);background-image:radial-gradient(circle,var(--pink) 2.4px,transparent 3px),radial-gradient(circle,var(--gold) 2px,transparent 2.6px);
  background-size:16px 16px,16px 16px;background-position:0 0,8px 8px}
.veilwrap.veil-on .veil{opacity:1}
.next{margin-top:18px}

/* noticed */
.sticky{background:var(--gold-soft);border:2px solid var(--gold);border-radius:8px 8px 22px 8px;padding:18px 18px 20px;font-family:'Baloo 2',system-ui,sans-serif;font-weight:600;font-size:22px;line-height:1.25;transform:rotate(-1.2deg);margin:6px 0 18px}
.sticky small{display:block;font-family:'Figtree',sans-serif;font-weight:500;font-size:13px;color:var(--muted);margin-top:8px}
.reacts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.reacts .opt{padding:16px 6px}
.reacts .opt .em{font-size:30px}

/* bug */
.ticket{border:2px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px}
.ticket .th{background:var(--surface2);padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;font-size:15px}
.ticket .tr{display:flex;gap:12px;padding:10px 14px;border-top:1.5px solid var(--line);font-size:15px}
.ticket .tr b{min-width:76px;color:var(--muted);font-weight:500}
.status{font-weight:700;color:var(--gold)}

/* try list */
.trylist{display:grid;gap:10px}
.tr-item{padding:12px 14px;border-radius:16px;background:var(--surface2);border:1.5px solid var(--line)}
.tr-item .t{font-weight:700;margin-bottom:8px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri.two2{grid-template-columns:repeat(2,1fr)}
.tri button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-weight:700;font-size:14px;cursor:pointer}
.tri button.s-k{border-color:var(--pink);background:var(--pink-soft)}
.tri button.s-v{border-color:var(--teal);background:var(--teal-soft)}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface2);font-size:15px}
.cmp.both{background:var(--gold-soft);outline:2px solid var(--gold)}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);white-space:nowrap}
.chip.k{border-color:var(--pink)}
.chip.v{border-color:var(--teal)}
.chiphd{font-size:12px;color:var(--muted);font-weight:700;text-align:center}
.half{margin-top:14px;padding:16px;border-radius:20px;background:var(--teal-soft);border:2px solid var(--teal)}
.half h3{font-family:'Baloo 2',system-ui,sans-serif;font-size:22px;margin:0 0 6px;line-height:1.15}
.half p{margin:0 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.done-msg{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--pink-soft);font-weight:700}
.err{color:var(--pink);font-weight:700;font-size:14px;margin:0 0 10px}
.lab{font-weight:700;margin:2px 0 8px;font-size:15px}
.nhie-pre{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:20px;margin:0 0 6px}

.pingbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--gold-soft);border:2px solid var(--gold);font-weight:700;margin-bottom:12px}
.photo{width:100%;border-radius:16px;display:block}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--surface2);border-radius:16px;padding:8px}
.pcard img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block}
.pcard small{display:block;padding:6px 4px 2px;color:var(--muted);font-size:13px}
.sr{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.filelabel{cursor:pointer}
.filelabel:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.safety{margin-top:18px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1.5px dashed var(--line);font-size:13.5px;color:var(--muted)}
.deckwrap{position:relative;height:330px;touch-action:pan-y}
.swipecard{position:absolute;inset:0;background:var(--surface2);border:2px solid var(--line);border-radius:26px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .18s ease,border-color .18s ease}
.swipecard.yes{border-color:var(--teal);background:var(--teal-soft)}
.swipecard.no{border-color:var(--pink);background:var(--pink-soft)}
.swipecard .poster{font-size:84px;line-height:1;margin-bottom:8px}
.swipecard h3{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:24px;line-height:1.1;margin:0 0 10px}
.swipebtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.cipher{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.4;word-break:break-all;background:var(--surface);padding:10px 12px;border-radius:12px;border:1.5px dashed var(--line);margin-top:4px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(20,10,50,.55);display:grid;place-items:center;padding:16px}
.mcard{background:var(--surface);color:var(--ink);border:2px solid var(--gold);border-radius:24px;padding:20px;max-width:400px;width:100%;max-height:90vh;overflow:auto}
.mcard h3{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:24px;line-height:1.15;margin:0 0 8px}
.timer{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:64px;line-height:1;text-align:center;margin:6px 0 0}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0 14px}
.bar i{display:block;height:100%;background:var(--pink);border-radius:99px}
.tagline{font-weight:700;font-size:19px;margin:0 0 6px}
.indic{font-size:21px;line-height:1.35;margin:0 0 10px;font-family:'Baloo 2','Noto Sans',system-ui,sans-serif}
.langs{margin:0 0 14px}
.langs button{padding:4px 11px;font-size:13.5px}
.chks{display:grid;gap:10px}
.chk{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border-radius:16px;background:var(--surface2);border:2px solid var(--line);cursor:pointer;font-weight:600;width:100%}
.chk .bx{font-size:20px;line-height:1.2}
.chk small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.chk.on-k{border-color:var(--pink);background:var(--pink-soft)}
.chk.on-v{border-color:var(--teal);background:var(--teal-soft)}
.chk[disabled]{cursor:default}
.row.both{border-left-color:var(--gold);background:var(--gold-soft)}
.cheers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.cheers button{border:2px solid var(--line);background:var(--surface2);border-radius:14px;padding:10px 0;font-size:24px;cursor:pointer}
.big{font-size:56px;line-height:1;margin:6px 0}
.chain{display:grid;gap:8px;margin:14px 0}
.bubble{padding:10px 14px;border-radius:16px;background:var(--surface2);border-left:6px solid var(--line);font-weight:600}
.bubble.k{border-left-color:var(--pink)}
.bubble.v{border-left-color:var(--teal)}
.bubble small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip-row button{border:2px solid var(--line);background:var(--surface2);border-radius:99px;padding:9px 16px;font-weight:700;cursor:pointer}
.story-start{font-family:'Baloo 2',system-ui,sans-serif;font-weight:600;font-size:20px;line-height:1.3;padding:14px 16px;border-radius:18px;background:var(--gold-soft);border:2px solid var(--gold)}
details.chap{padding:10px 14px;border-radius:14px;background:var(--surface2);border:1.5px solid var(--line);margin-top:8px}
details.chap summary{font-weight:700;cursor:pointer}
.sealed{padding:16px;border-radius:18px;background:var(--surface2);border:2px dashed var(--line);text-align:center;font-weight:700;margin:12px 0}
@media (prefers-reduced-motion:reduce){
  .veilwrap .vc,.veil{transition:none}
  .btn:active,.opt:active{transform:none}
  .swipecard{transition:none}
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DAYS = {
  '1':{type:'choice',tag:'This or that',q:'Chai or coffee to start the day?',
     opts:[{id:'chai',e:'☕',l:'Chai'},{id:'coffee',e:'🫘',l:'Coffee'}]},
  '2':{type:'choice',tag:'This or that',q:'Saturday night: garba floor or sofa and snacks?',
     opts:[{id:'garba',e:'💃',l:'Garba floor'},{id:'sofa',e:'🛋️',l:'Sofa + snacks'}]},
  '3':{type:'line',tag:'One line',q:'Best thing you ate this week?',ph:'One line is plenty ✍️'},
  '4':{type:'bet',tag:'I bet you would pick…',q:'City break or countryside cottage?',
     opts:[{id:'city',e:'🏙️',l:'City break'},{id:'cottage',e:'🏡',l:'Countryside cottage'}]},
  '5':{type:'noticed',tag:'Things I noticed',note:'You said you like less sugar in your chai. Noted ☕',
     opts:[{id:'right',e:'🎯',l:'Spot on',msg:'{V} is glowing somewhere 🌟'},
           {id:'sweet',e:'🥹',l:'Aww',msg:'Aww indeed. Message received 💛'},
           {id:'wrong',e:'🙈',l:'Not quite',msg:'Ha. Noted for next time 📝'}]},
  '6':{type:'pick',tag:'Sunday pick',q:'What are we watching this Sunday?',
     opts:[{id:'in',e:'🇮🇳',l:'Indian series',sub:'Something warm and desi'},
           {id:'west',e:'🌍',l:'Western series',sub:'Something bingeable'}]},
  '7':{type:'bug',tag:'Bug report',id:'Bug #1',summary:'Goes quiet for the first 10 minutes of calls.',
     opts:[{id:'adorable',e:'🥹',l:'Adorable'},{id:'minor',e:'🐛',l:'Minor'},{id:'critical',e:'🚨',l:'Critical'}]},
  '9':{type:'nhie',tag:'Never have I ever',q:'burned the chai 🫖',
     opts:[{id:'have',e:'🙋',l:'I have'},{id:'never',e:'🙅',l:'Never'}]},
  '14':{type:'try',tag:'Halfway Date',q:'Which of these should we try first?',
     items:[{id:'pottery',e:'🏺',l:'Pottery class'},{id:'iyengar',e:'🧘',l:'Iyengar workshop'},
            {id:'garba',e:'💃',l:'Garba or dance class'},{id:'photo',e:'📷',l:'Photo walk'},
            {id:'cook',e:'🍲',l:'Cook something together'},{id:'city',e:'🚆',l:'City break'}]}
};
const CORE = ['1','2','3','4','5','6','7','9','14'];

const PACKS = {
  college:{name:'College Days',e:'🎓',blurb:'Campus canteen, bunking, notes, cultural nights',cards:[
    {t:'choice',q:'Campus canteen or the coffee and chai cart outside?',o:[['canteen','🍽️','Campus canteen'],['cart','☕','Coffee or chai cart']],v:'cart',why:'Chai from the cart. Zero regrets.'},
    {t:'nhie',q:'bunked a lecture for a movie 🎬',v:'have',why:'Only once. Felt like a criminal.'},
    {t:'choice',q:'Night before the exam: cram all night or sleep and pray?',o:[['cram','📚','Cram all night'],['pray','😴','Sleep and pray']],v:'cram',why:'Notes photocopied at 1am, obviously.'},

const CRC_T = (()=>{ const t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? (c>>>1)^0xEDB88320 : c>>>1; t[n]=c>>>0; } return t; })();

function makeZip(files){

  for(const f of files){
    const name=enc.encode(f.name), data=(typeof f.data==='string'?enc.encode(f.data):f.data), crc=crc32(data);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(dt),...u16(dd),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);

  }

    const h=new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(dt),...u16(dd),...u32(c.crc),...u32(c.size),...u32(c.size),...u16(c.name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(c.offset)]);
    parts.push(h,c.name); offset += h.length+c.name.length;
  }

  parts.push(end);
  return new Blob(parts,{type:'application/octet-stream'});
}

/* ---- end-to-end encryption demo (real WebCrypto AES-256-GCM) ---- */
let ROOMKEY = null;
const SAFETY = ['🌻','🪁','🍋','🐘','🌙','🍀','🎈','🦋','🍉','🐢','🌶️','🪔','🎧','🍫','🌈','🛶'];
const AAD = () => new TextEncoder().encode('room:demo|type:note|v1');   // binds a ciphertext to its room and record type
const toB64 = u8 => { let s=''; for(let i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return btoa(s); };
const fromB64 = b => Uint8Array.from(atob(b), c=>c.charCodeAt(0));
async function ensureKey(){ if(!ROOMKEY) ROOMKEY = await crypto.subtle.generateKey({name:'AES-GCM',length:256}, true, ['encrypt','decrypt']); return ROOMKEY; }
async function lockText(text, aad){
  const key=await ensureKey(), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:aad||AAD()},key,new TextEncoder().encode(text)));
  const env=new Uint8Array(12+ct.length); env.set(iv,0); env.set(ct,12); return env;
}
async function unlockBytes(env, key, aad){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:env.slice(0,12),additionalData:aad||AAD()},key,env.slice(12));
  return new TextDecoder().decode(pt);
}
async function safetyCode(){
  const raw=await crypto.subtle.exportKey('raw',await ensureKey());
  const h=new Uint8Array(await crypto.subtle.digest('SHA-256',raw));
  return Array.from(h.slice(0,6)).map(b=>SAFETY[b%16]).join(' ');
}

async function privTest(kind){

/* ---- Remember When: 60-second timer and 30-second voice notes ---- */
let TICK = null, MR = null;
const REC_SECS = 30, REC_KBPS = 32000;   // Opus at 32 kbps is roughly 4 KB a second, so about 120 KB for 30 s
function ensureTick(){ if(!TICK) TICK = setInterval(timerTick, 250); }
function timerTick(){
  const T=S.timer[me()]; if(!T || !T.start || T.expired || T.done) return;
  const left=Math.max(0, T.len - Math.floor((Date.now()-T.start)/1000));
  const el=document.getElementById('timer'); if(el) el.textContent=left;
  const bar=document.getElementById('timerbar'); if(bar) bar.style.width=(left/T.len*100)+'%';
  if(left<=0){ T.expired=true; if(S.rec.recording && MR && MR.state==='recording') MR.stop(); render(); }
}
async function startVoice(){
  const P=S.rec; P.err='';
  try{
    if(window.__record){ P.pend = await window.__record(); render(); return; }
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mime = ['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4'].find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
    MR = new MediaRecorder(stream, Object.assign({audioBitsPerSecond:REC_KBPS}, mime?{mimeType:mime}:{}));
    const chunks=[]; P.t0=Date.now();
    MR.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    MR.onstop = () => {
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:MR.mimeType||mime||'audio/webm'});
      P.pend={blob,url:URL.createObjectURL(blob),bytes:blob.size,secs:Math.max(1,Math.round((Date.now()-P.t0)/1000))}; P.recording=false; render();
    };
    P.recording=true; MR.start();
    setTimeout(()=>{ if(MR && MR.state==='recording') MR.stop(); }, REC_SECS*1000);
  }catch(_){ P.err='Voice notes need microphone access. You can type your reply instead.'; P.recording=false; }
  render();
}

const getD = d => DAYS[d] || S.bonus[d] || PACKCARDS[d];
const ORDER = () => CORE.concat(Object.keys(S.bonus));
const isK = () => S.who==='invitee';
const me = () => isK()?'k':'v';
const FAMILY = t => t==='choice'||t==='pick'||t==='nhie';
function has(v,id){ return Array.isArray(v) ? v.includes(id) : v===id; }
const bothIn = d => S.ans[d].k!==null && S.ans[d].v.pick!==null && S.ans[d].v.pick!==undefined;

function done(d){ const D=getD(d); return D.type==='try' ? S.ans[d].sub : S.ans[d].k!==null; }
function needs(d){
  const D=getD(d), A=S.ans[d];
  if(isK()) return D.type==='try' ? !A.sub : A.k===null;
  if(FAMILY(D.type)||D.type==='bet'||D.type==='multi'||D.type==='guess') return A.v.pick===null||A.v.pick===undefined;
  if(D.type==='bug') return A.k!==null && A.reply===null;
  return false;
}
const firstNeeding = () => ORDER().find(needs);
const nextNeeding = d => { const o=ORDER(); return o.slice(o.indexOf(d)+1).find(needs); };

function optsFor(d){
  const D=getD(d), A=S.ans[d], m=me();
  const base = D.opts.slice();
  const ex = (A.extra||[]).filter(x=>{
    if(x.by===m) return true;
    if(D.type==='multi' && !isK()) return true;
    return isK() ? (A.k===null || has(A.k,x.id)) : (A.v.pick===null || has(A.v.pick,x.id));
  }).map(x=>({...x, sub: x.by===m ? 'Your idea ✨' : 'New option ✨'}));
  return base.concat(ex);
}
const allOpt = (d,id) => getD(d).opts.concat(S.ans[d].extra||[]).find(o=>o.id===id);

function veil(inner,d){
  const on = S.anim===d && isK();
  return `<div class="veilwrap${on?' veil-on':''}"><div class="vc">${inner}</div><div class="veil" aria-hidden="true"></div></div>`;
}
const rowK = h => `<div class="row k"><span class="nm">{K}</span><div class="val">${h}</div></div>`;
const rowV = h => `<div class="row v"><span class="nm">{V}</span><div class="val">${h}</div></div>`;
const waitBox = t => `<div class="wait">${t}</div>`;
const optLabel = o => `${o.e} ${esc(o.l)}${o.by?`<span class="added">✨ added by ${NAME[o.by]}</span>`:''}`;

function tile(d,o,cls,stack,locked,action='pick'){
  return `<button class="opt${stack?' row-h':''}${cls?' '+cls:''}" data-a="${action}" data-d="${d}" data-id="${o.id}"${locked?' disabled':''}>
    <span class="em">${o.e}</span><span><span class="lb">${esc(o.l)}</span>${o.sub?`<br><span class="sb">${o.sub}</span>`:''}</span></button>`;
}
function nextBtn(d){
  const P = getD(d).pack;
  if(P){
    const ids = PACKS[P].cards.map(c=>c.id);
    const n = ids.slice(ids.indexOf(d)+1).find(needs);
    return n ? `<button class="btn next" data-a="open" data-d="${n}">Chalo, next card ✨</button>`
             : `<button class="btn next ghost" data-a="pack" data-p="${P}">Back to ${PACKS[P].name}</button>`;
  }
  const n = nextNeeding(d);
  return n ? `<button class="btn next" data-a="open" data-d="${n}">Chalo, next card ✨</button>`
           : `<button class="btn next ghost" data-a="home">Back to Pehli Baat</button>`;
}

/* ---------- day views ---------- */
function thread(d){
  const A=S.ans[d]; A.ask=A.ask||{k:false,v:false}; A.cmt=A.cmt||{k:null,v:null}; A.skip=A.skip||{k:false,v:false};
  const m=me(), o=m==='k'?'v':'k', on=NAME[o];
  const say = (w,txt) => (w==='k'?rowK:rowV)(`<span style="font-weight:600">“${esc(txt)}”</span>`);
  let h='';
  ['k','v'].forEach(w=>{ if(A.cmt[w]) h+=say(w,A.cmt[w]); });
  if(A.ask[o] && A.cmt[m]===null && !A.skip[m]){
    h+=`<div class="customrow"><p>${on} wants the story 👀 One line is plenty.</p>
      <input class="field" id="cmt" maxlength="100" placeholder="The short version…" autocomplete="off">
      <div class="two"><button class="btn" data-a="cmtsend" data-d="${d}">Send</button><button class="btn ghost" data-a="cmtskip" data-d="${d}">Not today 🙂</button></div></div>`;
  }
  if(!A.ask[m]) h+=`<button class="btn ghost" data-a="ask" data-d="${d}">Tell me the story 👀</button>`;
  else if(A.cmt[o]===null) h+= A.skip[o] ? waitBox(`${on} is saving that one for later 🙂`) : waitBox(`Asked ${on} for the story 💭`);
  return h;
}

function familyBody(d){
  const D=getD(d), A=S.ans[d], stack=D.type==='pick', custom=(D.type==='choice'||D.type==='pick');
  const both = bothIn(d);
  if(!both){
    const sel = isK()? A.k : A.v.pick;
    const locked = isK() && A.k!==null;
    const list = optsFor(d);
    const cls = stack?'stack':'grid2';
    let html = `<div class="${cls}">${list.map(o=>tile(d,o,sel===o.id?(isK()?'sel-k':'sel-v'):'',stack,locked)).join('')}</div>`;
    const canAnswer = isK() ? A.k===null : true;
    if(custom && canAnswer){
      html += `<button class="opt row-h dashed" data-a="opencustom" data-d="${d}"><span class="em">✨</span><span class="lb">Something else…</span></button>`;
      if(S.custom===d){
        html += `<div class="customrow"><p>Type your own option. ${isK()?'{V}':'{K}'} will see it as a choice too.</p>
          <input class="field" id="custom" maxlength="40" placeholder="e.g. Rooftop chai" autocomplete="off">
          <button class="btn" data-a="custom" data-d="${d}">Add my option</button></div>`;
      }
    }
    if(isK()){
      html += A.k===null ? `<p class="hint">One tap. That's it.</p>` : waitBox('Saved ✓ Waiting for {V} 💭');
    } else {
      html += A.v.pick===null||A.v.pick===undefined
        ? waitBox(A.k!==null ? '{K} is in 💭 Your turn. Pick yours and both open up.' : 'Pick yours. It stays private until you both answer.')
        : waitBox('Waiting for {K} 💭 Your pick is saved. Tap another to change it.');
    }
    return html;
  }
  const ko=allOpt(d,A.k), vo=allOpt(d,A.v.pick), same=A.k===A.v.pick;
  let banner;
  if(D.type==='nhie') banner = same ? (A.k==='have'?'Both guilty 😄':'Two angels 😇') : 'One of you has a story 👀';
  else if(D.type==='pick') banner = `Sunday plan: ${ko.e} ${esc(ko.l)}`;
  else banner = same ? `You both picked ${esc(vo.l.toLowerCase())} ${vo.e} 🎉` : 'Two different picks. Good to know 😄';
  const extra = D.type==='pick' ? `<p class="hint" style="margin:0">${same?'Both of you said the same, easy. ':''}The watch-party link lands Sunday afternoon 📺</p>` : '';
  return `<div class="reveal"><p class="banner">${banner}</p>
    ${rowK(optLabel(ko))}
    ${veil(rowV(`${optLabel(vo)}${A.v.why?`<div class="why">“${esc(A.v.why)}”</div>`:''}`),d)}
    ${extra}${D.type==='nhie'?thread(d):''}${loveBlock(d)}${saveBlock(d)}</div>${nextBtn(d)}`;
}

function dayView(d){
  const D=getD(d), A=S.ans[d];
  let body='', tagText=D.tag, tagCls='tag';
  if(D.bonus){ tagText = D.by===me() ? 'Your card' : 'From '+NAME[D.by]; tagCls='tag from'; }
  if(D.pack){ tagText = PACKS[D.pack].e+' '+D.tag; tagCls='tag from'; }
  let heading = D.q ? `<h2 class="q">${D.q}</h2>` : '';
  if(D.type==='nhie') heading = `<h2 class="q"><small>Never have I ever…</small>${esc(D.q)}</h2>`;
  if(D.type==='noticed') heading = '<div style="height:12px"></div>';
  if(D.type==='bug') heading = '<h2 class="q">Bug report filed 🐞</h2>';
  if(D.bonus && D.type==='choice') heading = `<h2 class="q">${esc(D.q)}</h2>`;
  if(D.type==='guess') heading = `<h2 class="q" style="font-size:46px;letter-spacing:6px;margin-bottom:4px">${D.q}</h2><p class="hint" style="margin:0 0 16px">Which film is this?</p>`;

  if(FAMILY(D.type)) body = familyBody(d);
  if(D.type==='multi') body = multiBody(d);
  if(D.type==='recall') body = recallBody(d);
  if(D.type==='guess') body = guessBody(d);

  if(D.type==='line'){
    if(A.k===null){
      body = isK()
        ? `<input class="field" id="line" maxlength="80" placeholder="${D.ph}" autocomplete="off"><button class="btn" data-a="line" data-d="${d}">Send</button>`
        : `<input class="field" id="line" maxlength="80" value="${esc(A.v.text)}" autocomplete="off"><button class="btn ghost" data-a="line" data-d="${d}">Save my line</button>${waitBox('Waiting for {K} 💭')}`;
    } else {
      body = `<div class="reveal"><p class="banner">${D.banner||'Two plates, two stories 🍽️'}</p>
        ${rowK(esc(A.k))}${veil(rowV(esc(A.v.text)),d)}${D.cheer?cheerBlock(d):loveBlock(d)}${saveBlock(d)}</div>${nextBtn(d)}`;
    }
  }
  if(D.type==='bet'){
    if(A.k===null){
      const sel = isK()?null:A.v.pick;
      const intro = isK() ? '🎲 {V} placed a sealed bet on you. Now pick for real:' : '🎲 Bet on what {K} will pick:';
      body = `<div class="wait" style="margin:0 0 14px;background:var(--gold-soft)">${intro}</div>
        <div class="grid2">${D.opts.map(o=>tile(d,o,sel===o.id?'sel-v':'',false,false)).join('')}</div>`;
    } else {
      const ko=allOpt(d,A.k), vo=allOpt(d,A.v.pick), same=A.k===A.v.pick;
      body = `<div class="reveal"><p class="banner">${same?'{V} called it 😏':'{V} was way off 🙈 They will live.'}</p>
        ${rowK(`Picked ${ko.e} ${ko.l}`)}${veil(rowV(`Bet on ${vo.e} ${vo.l}`),d)}${loveBlock(d)}${saveBlock(d)}</div>${nextBtn(d)}`;
    }
  }
  if(D.type==='noticed'){
    const note = `<div class="sticky">${D.note}<small>from {V}, one small thing they noticed</small></div>`;
    if(A.k===null){
      body = note + (isK()
        ? `<div class="reacts">${D.opts.map(o=>`<button class="opt" data-a="pick" data-d="${d}" data-id="${o.id}"><span class="em">${o.e}</span><span class="lb">${o.l}</span></button>`).join('')}</div><p class="hint">Tap how it landed.</p>`
        : waitBox('Sent. Waiting for {K} 💭'));
    } else {
      const r=D.opts.find(o=>o.id===A.k);
      body = note + `<div class="reveal">${rowK(`${r.e} ${r.l}`)}<p class="hint" style="margin:0">${r.msg}</p></div>${nextBtn(d)}`;
    }
  }
  if(D.type==='bug'){
    const sevRow = A.k===null ? 'loading…' : (()=>{const o=D.opts.find(x=>x.id===A.k);return `${o.e} ${o.l}`})();
    const stat = A.reply==='fixed' ? 'Fixed ✅ (in progress)' : A.reply==='wontfix' ? "Won't fix 😌 (it's a feature)" : 'Open';

async function compressImage(file, maxDim=1280, quality=0.72, targetKB=300){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const scale = Math.min(1, maxDim/Math.max(img.naturalWidth,img.naturalHeight));
    const w = Math.max(1,Math.round(img.naturalWidth*scale)), h = Math.max(1,Math.round(img.naturalHeight*scale));
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);          // re-drawing strips EXIF, including location
    let q=quality, blob=null;
    for(let i=0;i<5;i++){
      blob = await new Promise(r=>c.toBlob(r,'image/jpeg',q));
      if(!blob) throw new Error('encode');
      if(blob.size<=targetKB*1024) break;
      q = Math.max(0.35, q-0.12);
    }
    const dataUrl = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });
    return {dataUrl, bytes:blob.size, w, h};
  } finally { URL.revokeObjectURL(url); }
}

function dataUrlToFile(url, base){
  const m=/^data:([^;,]+)((?:;[^;,]+)*),([\s\S]*)$/.exec(url||''); if(!m) return null;   // allows ;base64 and ;utf8 style parameters
  const ext = m[1]==='image/jpeg'?'jpg':m[1]==='image/png'?'png':m[1]==='image/svg+xml'?'svg':(m[1].split('/')[1]||'bin');
  const bytes = /;base64/.test(m[2]) ? Uint8Array.from(atob(m[3]),c=>c.charCodeAt(0)) : new TextEncoder().encode(decodeURIComponent(m[3]));
  return {name:`${base}.${ext}`, bytes};
}
function revealed(d){
  const D=getD(d), A=S.ans[d]; if(!D||!A) return false;
  if(D.type==='try') return !!A.sub;
  if(D.type==='line' || D.type==='recall') return A.k!==null && A.v.text!=null;
  if(D.type==='noticed'||D.type==='bug') return A.k!==null;
  if(['choice','pick','nhie','multi','guess','bet'].includes(D.type)) return A.k!==null && A.v.pick!=null;
  return false;
}

  const xl = new Uint8Array(await makeXlsx(sheets).arrayBuffer());

  return {blob:makeZip([{name:'README.txt',data:readme}].concat(out,files)), photos:files.length, sheets:sheets.length};

function ansText(d,w){
  const D=getD(d), A=S.ans[d];
  const lab = id => { const o=allOpt(d,id); return o ? o.l : String(id); };
  const clean = x => String(x||'').replace(/[^\p{L}\p{N}\s'!?.,-]/gu,'').trim();
  if(D.type==='line') return w==='k' ? A.k : A.v.text;
  if(D.type==='multi'){ const arr = w==='k' ? A.k : A.v.pick; return (arr||[]).map(lab).join(', '); }
  if(D.type==='recall'){ const x = w==='k' ? A.k : {text:A.v.text}; if(!x) return ''; return x.skip ? 'Skipped' : (x.text || (x.voice ? '(voice note)' : '')); }
  if(D.type==='try'){ const obj = w==='k' ? A.k : A.v; return D.items.map(it=>`${it.l}: ${clean(TRY[obj[it.id]])}`).join('; '); }
  if(D.type==='noticed') return w==='k' ? (A.k ? lab(A.k) : '') : 'Sent this note';
  if(D.type==='bug') return w==='k' ? (A.k ? lab(A.k) : '') : (A.reply==='fixed' ? 'Fixed' : A.reply==='wontfix' ? "Won't fix" : '');
  const id = w==='k' ? A.k : A.v.pick;
  return id==null ? '' : lab(id);
}

let drag = null;

  const c = e.target.closest && e.target.closest('.swipecard'); if(!c) return;

  if(!drag) return;
  drag.dx = e.clientX - drag.x;
  drag.el.style.transform = `translateX(${drag.dx}px) rotate(${drag.dx/18}deg)`;
  drag.el.classList.toggle('yes', drag.dx>40); drag.el.classList.toggle('no', drag.dx<-40);

const endDrag = () => {
  if(!drag) return;

  else if(a==='mwhen'){ S.micro.when=t.dataset.w; }
  else if(a==='mfin'){ const M=S.micro; M.done++; M.cur=null; M.k=null; M.v='keen'; M.when=null; }
  else if(a==='anext'){
    const An=S.anta, val=(document.getElementById('anta').value||'').trim();
    if(!val || An.turn!==me()) return;
    const songs=An.chain.filter(x=>!x.pass), L=lastLetter(songs[songs.length-1].t);
    if(firstLetter(val)!==L){ An.err='It needs to start with "'+L+'". Try another 🎵'; }
    else { An.chain.push({by:me(),t:val}); An.turn=me()==='k'?'v':'k'; An.err=''; }
  }
  else if(a==='apass'){ const An=S.anta; if(An.turn!==me()) return; An.chain.push({by:me(),pass:true}); An.turn=me()==='k'?'v':'k'; An.err=''; }
  else if(a==='asave'){ const An=S.anta; An.saved.push(An.chain.filter(x=>!x.pass).map(x=>x.t)); An.chain=[{by:'app',t:A_START[An.saved.length%A_START.length]}]; An.turn='k'; An.err=''; }
  else if(a==='sadd'){
    const T=S.story, val=(document.getElementById('story').value||'').trim();
    if(!val || T.turn!==me()) return;
    T.lines.push({by:me(),t:val}); T.turn=me()==='k'?'v':'k';
    if(T.lines.length>=8) finishStory();
  }
  else if(a==='sfinish'){ if(S.story.lines.length>=4 && S.story.turn===me()) finishStory(); }
  else if(a==='capseal'){
    const C=S.capsule, val=(document.getElementById('cap').value||'').trim();
    if(!val || C.sealed[me()]) return;
    C[me()]=val; C.sealed[me()]=true;
  }
  else if(a==='capopen'){ S.capsule.opened=!S.capsule.opened; }
  else if(a==='ask'){ A.ask=A.ask||{k:false,v:false}; A.ask[me()]=true; }
  else if(a==='cmtsend'){
    const val=(document.getElementById('cmt').value||'').trim(); if(!val) return;
    A.cmt=A.cmt||{k:null,v:null}; A.cmt[me()]=val;
  }
  else if(a==='cmtskip'){ A.skip=A.skip||{k:false,v:false}; A.skip[me()]=true; }
  else if(a==='reply'){ if(!isK()) S.ans['7'].reply=t.dataset.r; }
  else if(a==='season'){ S.ans['14'].season=t.dataset.r; }
  else if(a==='new'){ S.screen='new'; S.draft={kind:'choice',q:'',a:'',b:'',mine:null,err:''}; window.scrollTo(0,0); }
  else if(a==='kind'){ S.draft.kind=t.dataset.k; S.draft.mine=null; S.draft.err=''; }
  else if(a==='mine'){ S.draft.mine=t.dataset.m; }
  else if(a==='save'){
    const dr=S.draft;
    const q=dr.q.trim(), o1=dr.a.trim(), o2=dr.b.trim();
    if(!q){ dr.err = dr.kind==='choice' ? 'Add a question first.' : 'Finish the sentence first.'; }
    else if(dr.kind==='choice' && (!o1||!o2)){ dr.err='Add both options.'; }
    else if(!dr.mine){ dr.err='Pick your own answer, so it is ready when they reply.'; }
    else {
      const id='b'+Date.now(), m=me();
      const card = dr.kind==='choice'
        ? {type:'choice',bonus:true,by:m,tag:'This or that',q,opts:[{id:'a',e:'👈',l:o1},{id:'b',e:'👉',l:o2}]}
        : {type:'nhie',bonus:true,by:m,tag:'Never have I ever',q,opts:[{id:'have',e:'🙋',l:'I have'},{id:'never',e:'🙅',l:'Never'}]};
      S.bonus[id]=card;
      S.ans[id] = m==='k' ? {k:dr.mine,v:{pick:null},extra:[]} : {k:null,v:{pick:dr.mine},extra:[]};
      S.screen='home'; S.toast=`Card sent to ${isK()?'{V}':'{K}'} 💌 Flip phones to answer it.`;
      S.draft={kind:'choice',q:'',a:'',b:'',mine:null,err:''}; window.scrollTo(0,0);
    }
    if(S.screen==='new') dr.err = dr.err;
  }
  render();
});
render();
// Light up the Excel export when the page runs inside Claude (design for absence)
try{
  if(window.claude && typeof window.claude.use==='function'){
    window.claude.use('downloads').then(d=>{ DL=d; if(S.screen==='saved') render(); }).catch(()=>{});
  }
}catch(_){}
</script>
